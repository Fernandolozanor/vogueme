<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#24211D"/>
      <stop offset="50%" stop-color="#181715"/>
      <stop offset="100%" stop-color="#0E0D0C"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFDF7"/>
      <stop offset="35%" stop-color="#F7EFE2"/>
      <stop offset="70%" stop-color="#E5D3B8"/>
      <stop offset="100%" stop-color="#C5A880"/>
    </linearGradient>
    <filter id="subtleGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Squircle rounded background -->
  <rect width="512" height="512" rx="128" fill="url(#bgGrad)"/>
  
  <!-- Subtle border ring -->
  <rect x="8" y="8" width="496" height="496" rx="120" fill="none" stroke="#D6CDBC" stroke-opacity="0.25" stroke-width="4"/>

  <!-- Editorial Monogram V -->
  <g transform="translate(14, 0)">
    <!-- Thick left leg of V -->
    <path d="M 140 148 L 195 148 L 246 338 L 202 338 Z" fill="url(#goldGrad)"/>
    <!-- Thin right leg with serif -->
    <path d="M 326 148 L 358 148 L 246 376 L 222 376 Z" fill="url(#goldGrad)"/>
    <!-- Left serif -->
    <path d="M 124 148 L 210 148 L 210 162 L 124 162 Z" fill="url(#goldGrad)"/>
    <!-- Right serif -->
    <path d="M 314 148 L 372 148 L 372 162 L 314 162 Z" fill="url(#goldGrad)"/>
  </g>

  <!-- Sparkling 4-point star -->
  <path d="M 368 130 Q 368 160 398 160 Q 368 160 368 190 Q 368 160 338 160 Q 368 160 368 130 Z" fill="#FFD700" filter="url(#subtleGlow)"/>
  <circle cx="368" cy="160" r="4" fill="#FFFFFF"/>
</svg>
