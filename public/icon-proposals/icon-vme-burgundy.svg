<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Background Velvet Burgundy Gradient -->
    <linearGradient id="bgGradBurgundy" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3A0D18"/>
      <stop offset="50%" stop-color="#24070E"/>
      <stop offset="100%" stop-color="#120206"/>
    </linearGradient>

    <!-- Pearl Ivory Gradient -->
    <linearGradient id="pearlGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="50%" stop-color="#F9F5EE"/>
      <stop offset="100%" stop-color="#E5D9C5"/>
    </linearGradient>

    <!-- Gold Accent -->
    <linearGradient id="goldAccentVme" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFEBB8"/>
      <stop offset="60%" stop-color="#D4AF37"/>
      <stop offset="100%" stop-color="#997A1E"/>
    </linearGradient>

    <filter id="shadowBurgundy" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.75"/>
    </filter>
  </defs>

  <!-- iOS Squircle Frame -->
  <rect width="512" height="512" rx="120" fill="url(#bgGradBurgundy)"/>
  <rect x="10" y="10" width="492" height="492" rx="112" fill="none" stroke="url(#goldAccentVme)" stroke-width="2" stroke-opacity="0.35"/>

  <!-- Centered Vme Emblem -->
  <g filter="url(#shadowBurgundy)" transform="translate(0, 5)">
    <!-- Monumental Architectural V -->
    <path d="M 140 145 L 205 145 L 256 340 L 222 340 Z" fill="url(#pearlGrad)"/>
    <path d="M 330 145 L 355 145 L 256 375 L 235 375 Z" fill="url(#pearlGrad)"/>
    
    <!-- Top Serifs of V -->
    <rect x="125" y="142" width="90" height="10" rx="2" fill="url(#pearlGrad)"/>
    <rect x="320" y="142" width="45" height="10" rx="2" fill="url(#pearlGrad)"/>

    <!-- Italic cursive "me" nestled softly inside the V valley -->
    <g transform="translate(235, 235)">
      <!-- 'm' letterform in soft warm champagne gold -->
      <path d="M 10 70 C 10 40 24 25 42 25 C 56 25 64 34 68 48 C 74 34 86 25 102 25 C 122 25 132 40 132 65 L 132 120 L 114 120 L 114 68 C 114 50 106 42 94 42 C 82 42 74 52 72 68 L 72 120 L 54 120 L 54 68 C 54 50 46 42 34 42 C 22 42 14 52 12 68 L 12 120 L -6 120 L -6 28 L 10 28 Z" 
            fill="url(#goldAccentVme)"/>

      <!-- 'e' letterform with signature loop -->
      <path d="M 148 72 C 148 38 164 25 188 25 C 210 25 222 42 222 70 C 222 76 221 82 220 86 L 164 86 C 166 106 176 114 192 114 C 202 114 212 108 216 100 L 228 110 C 218 124 204 130 188 130 C 162 130 148 110 148 72 Z M 204 70 C 204 48 196 38 184 38 C 172 38 166 48 164 70 Z" 
            fill="url(#goldAccentVme)"/>
    </g>

    <!-- Star Sparkle on Right -->
    <polygon points="355,130 360,140 370,145 360,150 355,160 350,150 340,145 350,140" fill="#FFFDF8"/>
  </g>

  <!-- Typography Signature -->
  <text x="256" y="445" font-family="'Playfair Display', serif" font-size="20" font-weight="600" fill="#F9F5EE" letter-spacing="8" text-anchor="middle" opacity="0.9">VOGUEME</text>
  <text x="256" y="468" font-family="'Plus Jakarta Sans', sans-serif" font-size="10.5" font-weight="600" fill="#D4AF37" letter-spacing="4" text-anchor="middle">HAUTE COUTURE SEAL</text>
</svg>